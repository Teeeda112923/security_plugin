name: Update WordPress.org assets

# Syncs readme.txt and marketing images (.wordpress-org/) to the WordPress.org
# listing WITHOUT cutting a new release. Runs when those files change on the
# default branch — so an auto-bumped "Tested up to" goes live without a tag.
on:
  push:
    branches:
      - main
      - master
    paths:
      - 'readme.txt'
      - '.wordpress-org/**'
  workflow_dispatch:

jobs:
  assets:
    name: Update readme and assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Update WordPress.org page
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: site-security-checker
          ASSETS_DIR: .wordpress-org
