name: PHP syntax check

on:
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/php-syntax.yml'
  push:
    branches:
      - main
      - fix/incomplete-vulnerability-scan-status

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './.git/*' -print0 |
            while IFS= read -r -d '' file; do
              php -l "$file"
            done
